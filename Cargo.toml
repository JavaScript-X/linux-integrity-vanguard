[workspace]
members = ["crates/liv-core"]
resolver = "3"

[workspace.package]
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/JavaScript-X/linux-integrity-vanguard"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
